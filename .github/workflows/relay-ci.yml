name: Relay CI

# Type-checks the relay and runs its admin-panel tests: the admin API, the
# slash commands, the permission and invite stores, and the panel's own client
# scripts (test/admin-spa.test.ts loads portal-admin/*.js in node:vm). It also
# runs the channel-creation gate tests and the voice tests. The rest of the
# relay suite (the gateway's among it) is not run here; the gateway logging
# test is known to be flaky.

on:
  pull_request:
    paths:
      - 'portal-relay/**'
      - 'portal-protocol/**'
      - 'portal-admin/**'
      - '.github/workflows/relay-ci.yml'
  push:
    branches: [main]
    paths:
      - 'portal-relay/**'
      - 'portal-protocol/**'
      - 'portal-admin/**'
      - '.github/workflows/relay-ci.yml'

permissions:
  contents: read

concurrency:
  # As in client-ci.yml: a newer run of a pull request cancels the one in
  # progress; runs for distinct main commits never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  relay:
    name: Relay typecheck & admin tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The floor the relay's engines promise, pinned exactly, and the current
    # maintained line.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            portal-protocol/package-lock.json
            portal-relay/package-lock.json

      # The relay imports portal-protocol through its built output (package
      # main/types point into dist/), and its tsconfig references
      # ../portal-protocol as a project, so protocol is built first.
      # @animalabs/voice-kit comes from npm, as relay's lockfile pins it.
      - name: Build protocol
        working-directory: portal-protocol
        run: |
          npm ci
          npm run build

      - name: Install & typecheck relay
        working-directory: portal-relay
        run: |
          npm ci
          npx tsc --noEmit -p .

      # Later phases add their new admin test files to this list.
      - name: Admin tests
        working-directory: portal-relay
        run: >-
          node --import tsx --test
          test/admin*.test.ts
          test/access.test.ts
          test/slash.test.ts
          test/permissions.test.ts
          test/invites.test.ts
          test/mint-invite.test.ts

      # The gate on create_text_channel (#16): what lets a persona have the
      # shared bot create a channel.
      - name: Channel-creation gate tests
        working-directory: portal-relay
        run: node --import tsx --test test/create-text-channel.test.ts

      # Voice output, speech and transcripts. voice-sink.test.ts loads
      # voice-speaker.ts, the module that loads @animalabs/voice-kit at run
      # time, so it also checks the installed package loads.
      - name: Voice tests
        working-directory: portal-relay
        run: node --import tsx --test test/voice-*.test.ts
