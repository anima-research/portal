name: Client CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # In a pull request, the newest run to start cancels the one in progress:
  # usually a newer push superseding an older one, though re-running an older
  # run cancels the current one too. Runs for distinct main commits have
  # groups of their own, so they never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each package is its own job, so a failure in one never skips another's
  # checks.
  protocol:
    name: Protocol strict install, build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The floor the packages' engines promise, pinned exactly, the newest
    # Node, and 24, the maintained line between them.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: portal-protocol/package-lock.json

      - name: Install, build & test protocol
        working-directory: portal-protocol
        run: |
          npm ci
          npm run build
          npm test

  client:
    name: Client strict install, build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: portal-client/package-lock.json

      # The client's imports resolve to the published protocol release its
      # own lockfile pins, which npm ci installs into node_modules, not to
      # ../portal-protocol's sources. So a protocol change reaches this check
      # when the client's lockfile moves to the release that carries it, and
      # consumers, who resolve the client's range themselves, may get a later
      # release than the one checked here. The client's tsconfig still
      # references ../portal-protocol as a project, so the checkout must
      # include it.
      - name: Install, build & test client
        working-directory: portal-client
        run: |
          npm ci
          npm run build
          npm test

  client-floors:
    name: Client at its dependencies' floors, build & test (Node 22.12.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: portal-client/package-lock.json

      - name: Install each dependency at the lowest release its range admits
        working-directory: portal-client
        run: |
          npm ci
          floors=$(node -e '
            const { execFileSync } = require("node:child_process");
            for (const [name, range] of Object.entries(require("./package.json").dependencies)) {
              // npm view prints a bare string when one release matches, and an array when several do.
              const releases = [JSON.parse(execFileSync("npm", ["view", `${name}@${range}`, "version", "--json"], { encoding: "utf8" }))].flat();
              releases.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
              console.log(`${name}@${releases[0]}`);
            }
          ')
          npm install --no-save $floors
          npm ls --depth=0

      - name: Build & test client
        working-directory: portal-client
        run: |
          npm run build
          npm test

  mcpl:
    name: MCPL strict install, build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            portal-protocol/package-lock.json
            portal-client/package-lock.json
            portal-mcpl/package-lock.json

      # portal-mcpl links portal-protocol and portal-client from this
      # checkout (file:../portal-protocol, file:../portal-client), and its
      # tsconfig references both projects, so they're built first. The
      # client's own imports still resolve to the published protocol its
      # lockfile pins, as the client job's comment says, so mcpl runs against
      # this checkout's protocol and client, with the client on that release.
      - name: Build protocol and client
        run: |
          (cd portal-protocol && npm ci && npm run build)
          (cd portal-client && npm ci && npm run build)

      - name: Install, build & test mcpl
        working-directory: portal-mcpl
        run: |
          npm ci
          npm run build
          npm test
